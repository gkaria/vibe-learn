# vibe-learn — Claude Code learning companion
# Schema: https://github.com/mcs-cli/mcs/blob/main/docs/techpack-schema.md
# Guide: https://github.com/mcs-cli/mcs/blob/main/docs/creating-tech-packs.md

schemaVersion: 1
identifier: vibe-learn
displayName: Vibe Learn
description: Learning companion that observes Claude Code sessions and helps you understand what was built
author: "Gaurang Karia"
minMCSVersion: "2026.4.1"

components:
  # ── Dependencies ──────────────────────────────────────────
  - id: jq
    description: JSON processor (required by all hooks)
    brew: jq

  # ── Hooks ─────────────────────────────────────────────────
  - id: hook-bootstrap
    description: Initialize session logging and rotate previous logs
    dependencies: [jq]
    hookEvent: SessionStart
    hookStatusMessage: "Initializing vibe-learn..."
    hook:
      source: scripts/bootstrap.sh
      destination: bootstrap.sh

  - id: hook-capture-prompt
    description: Log user prompts for intent context
    dependencies: [jq]
    hookEvent: UserPromptSubmit
    hook:
      source: scripts/capture-prompt.sh
      destination: capture-prompt.sh

  - id: hook-observe
    description: Record Write/Edit/NotebookEdit/Bash events to session log
    dependencies: [jq]
    hookEvent: PostToolUse
    hookMatcher: "Write|Edit|MultiEdit|NotebookEdit|Bash"
    hook:
      source: scripts/observe.sh
      destination: observe.sh

  - id: hook-pause-summary
    description: Generate human-readable summary after each response
    dependencies: [jq]
    hookEvent: Stop
    hook:
      source: scripts/pause-summary.sh
      destination: pause-summary.sh

  # ── Support scripts ───────────────────────────────────────
  # fileType: hook puts them in the hooks directory beside the hook scripts,
  # which load them from their own directory (mcs puts generic files in
  # .claude/ instead).
  - id: script-knowledge
    description: Knowledge ledger helper used by /quiz, /learn, and /digest (record/touch/list/due)
    dependencies: [jq]
    type: generic
    installAction:
      type: copyPackFile
      source: scripts/knowledge.sh
      destination: knowledge.sh
      fileType: hook

  - id: script-identity
    description: Resolves the assistant, model, effort, and version for session-meta.json and turn_end lines
    dependencies: [jq]
    type: generic
    installAction:
      type: copyPackFile
      source: scripts/identity.sh
      destination: identity.sh
      fileType: hook

  - id: script-session-lib
    description: Shared jq definitions over the session log (learning-turn detection, session facts)
    dependencies: [jq]
    type: generic
    installAction:
      type: copyPackFile
      source: scripts/lib/session.jq
      destination: session.jq
      fileType: hook

  - id: script-health
    description: Assistant health rows (one per session segment) appended to health.jsonl at log rotation
    dependencies: [jq]
    type: generic
    installAction:
      type: copyPackFile
      source: scripts/health.sh
      destination: health.sh
      fileType: hook

  - id: script-usage
    description: Counts tool calls and skills per session from the host's own session record, for health rows
    dependencies: [jq]
    type: generic
    installAction:
      type: copyPackFile
      source: scripts/usage.sh
      destination: usage.sh
      fileType: hook

  - id: script-health-report
    description: vibe-learn health — compares session signals before and after a model or harness change
    dependencies: [jq]
    type: generic
    installAction:
      type: copyPackFile
      source: scripts/health-report.sh
      destination: health-report.sh
      fileType: hook

  - id: script-briefing
    description: vibe-learn briefing — static HTML session briefing and NotebookLM pack, built on demand and by /learn and /digest
    dependencies: [jq]
    type: generic
    installAction:
      type: copyPackFile
      source: scripts/briefing.sh
      destination: briefing.sh
      fileType: hook

  - id: script-briefing-render
    description: jq renderer for the briefing pages
    dependencies: [jq]
    type: generic
    installAction:
      type: copyPackFile
      source: scripts/lib/briefing.jq
      destination: briefing.jq
      fileType: hook

  - id: script-briefing-health-template
    description: Template for the briefing's assistant health page
    type: generic
    installAction:
      type: copyPackFile
      source: scripts/lib/briefing-health.html
      destination: briefing-health.html
      fileType: hook

  - id: script-briefing-index-template
    description: Template for the briefing index page
    type: generic
    installAction:
      type: copyPackFile
      source: scripts/lib/briefing-index.html
      destination: briefing-index.html
      fileType: hook

  - id: script-briefing-session-template
    description: Template for the briefing session page
    type: generic
    installAction:
      type: copyPackFile
      source: scripts/lib/briefing-session.html
      destination: briefing-session.html
      fileType: hook

  - id: script-briefing-pack
    description: jq renderer for the NotebookLM source pack
    dependencies: [jq]
    type: generic
    installAction:
      type: copyPackFile
      source: scripts/lib/pack.jq
      destination: pack.jq
      fileType: hook

  - id: script-recap
    description: Weekly "what I learned" markdown rollup built from the knowledge ledger and session logs
    dependencies: [jq]
    type: generic
    installAction:
      type: copyPackFile
      source: scripts/recap.sh
      destination: recap.sh
      fileType: hook

  # ── Commands ──────────────────────────────────────────────
  - id: cmd-learn
    description: /learn — explain what just happened or answer a session question
    command:
      source: .claude/commands/learn.md
      destination: learn.md

  - id: cmd-digest
    description: /digest — structured learning report for the session
    command:
      source: .claude/commands/digest.md
      destination: digest.md

  - id: cmd-quiz
    description: /quiz — recall questions that check understanding, tracked in the knowledge ledger
    command:
      source: .claude/commands/quiz.md
      destination: quiz.md

  - id: cmd-explain
    description: /explain — guided code tour of a file or subsystem the session touched
    command:
      source: .claude/commands/explain.md
      destination: explain.md

  # ── Configuration ─────────────────────────────────────────
  # Reference templates are plain files, not merged settings, so they ship via
  # copyPackFile — there is no `config:` shorthand in the techpack schema.
  - id: config-knowledge-defaults
    description: Reference config template for quiz and knowledge ledger options
    type: configuration
    installAction:
      type: copyPackFile
      source: config/knowledge-defaults.json
      destination: config/knowledge-defaults.json
      fileType: generic

  - id: config-obsidian-defaults
    description: Reference config template for Obsidian integration options
    type: configuration
    installAction:
      type: copyPackFile
      source: config/obsidian-defaults.json
      destination: config/obsidian-defaults.json
      fileType: generic

  - id: gitignore
    description: Exclude vibe-learn session data from version control
    isRequired: true
    gitignore:
      - .vibe-learn/

templates:
  - sectionIdentifier: instructions
    contentFile: templates/instructions.md
